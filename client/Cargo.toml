[package]
name = "revvy-client"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Editor de pista. Activo por defecto en desktop.
# En Android/iOS el módulo no se compila (fase 11 lo saca del default de esos targets).
default = ["track-editor"]
track-editor = []

[dependencies]
anyhow.workspace = true
bevy_ecs = "0.19"
revvy-formats = { path = "../crates/formats" }
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"
glam.workspace = true
image = { version = "0.25", default-features = false, features = ["bmp"] }
kira = { version = "0.12", default-features = false, features = ["cpal", "wav", "pcm"] }
pollster = "0.4"
revvy-physics = { path = "../crates/physics" }
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wgpu = "30"
winit = "0.30"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"
